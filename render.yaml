# Chauka — Render Deployment Configuration
# https://render.com/docs/infrastructure-as-code
#
# This repo is the self-hosted restaurant system (license-gated). The
# public marketing site lives in its own repository.

services:
  - type: web
    name: chauka
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 18
      # Point at your licensing server; leave LICENSE_KEY unset for your own
      # managed cloud deploy, or set it to license a customer install.
      #   - key: LICENSE_SERVER_URL
      #     value: https://licenses.yourdomain.com
      #   - key: LICENSE_KEY
      #     value: CHK-XXXX-XXXX-XXXX-XXXX
    autoDeploy: true
