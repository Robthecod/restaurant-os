# Chauka — Render Deployment Configuration
# https://render.com/docs/infrastructure-as-code

services:
  - type: web
    name: chauka
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 18
      # Public marketing deployment — serves only the landing page + lead
      # forms. The restaurant app (/app/*) and its APIs stay disabled here.
      # Local restaurant installs run without this variable.
      - key: PUBLIC_ONLY
        value: "true"
    autoDeploy: true
